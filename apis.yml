x-correction-request:
  requested: '2026-09-30'
  source:
  - 'email: Harry Lucas <harry@getphas.io> to info@apievangelist.com, "Update to Phasio APIs", 2026-09-30, message-id <CABGNfSt4OZ+4hokQtPd3Z58S1CgEcQnt8sbOUrsg6pzh9_xMhQ@mail.gmail.com>'
  request: The profile used a very old version of the Phasio API, most of which has been deprecated. Re-run against
    the current system, remove the older endpoints, and keep a fully up-to-date listing.
  applied: '2026-10-06'
  applied_note: 'Applied by hand from the LIVE docs 2026-10-06. Phasio does not serve a standalone OpenAPI file (docs.phas.io/openapi.json
    404, m-api.eu.phas.io/v3/api-docs 401); its current contract is the bundled OpenAPI 3.2.0 document embedded in the
    docs.phas.io API reference (130 operations, all under /api/manufacturer/v1), saved as openapi/_original/phasio-openapi.json.
    The old contract (481 operations incl. /api/customer/v1 and /api/internal/v1) moved to openapi/_superseded/; 381
    operations absent from the current contract were removed, 100 kept, 30 new. Re-split + standardized into 32 APIs;
    92 old API entries and their 184 collections replaced (64 collections regenerated). Auth described per current docs
    (Bearer API key, Settings > API Keys). MCP candidate, skills, error catalog, lifecycle (migration guides), llms.txt,
    data-model/auth/overlay pointers and capability edges updated to the current contract.'
