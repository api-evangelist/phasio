aid: phasio
name: Phasio
description: >-
  Phasio is an operating platform for manufacturing service providers that unifies
  intelligent quoting, production operations, connected back-office/ERP integration,
  part intelligence, and white-labeled customer storefronts. It serves contract
  manufacturers across additive manufacturing, CNC machining, and injection molding,
  generating CAD-based quotes in seconds and managing shop-floor routing and
  scheduling. The Phasio Manufacturer REST API (v1, base /api/manufacturer/v1) is
  published as an OpenAPI 3.2 contract of 130 operations across 32 resource groups
  covering orders, carts, customers and customer organisations, addresses, part
  revisions and specifications, requisitions and work orders, production steps and
  routing templates, documents, payments, shipments and shipping rates, and webhooks,
  authenticated with a Bearer API key created under Settings > API Keys.
