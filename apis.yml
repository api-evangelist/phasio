aid: phasio
name: Phasio
description: >-
  Phasio is an operating platform for manufacturing service providers that unifies
  intelligent quoting, production operations, connected back-office/ERP integration,
  part intelligence, and white-labeled customer storefronts. It serves contract
  manufacturers across additive manufacturing, CNC machining, and injection molding,
  generating CAD-based quotes in seconds and managing shop-floor routing and
  scheduling. The Phasio Manufacturer API (v1) is an OpenAPI 3.1 REST API of 481
  operations across 85 controllers covering orders, quotes, requisitions, part
  specifications and revisions, shipments, production steps, discounts, expenses,
  taxes, and webhooks, secured with OAuth 2.0 client-credentials Bearer JWTs.
url: https://raw.githubusercontent.com/api-evangelist/phasio/refs/heads/main/apis.yml
