openapi: 3.2.0
info:
  title: Phasio Equation Resource API
  description: This is the API documentation for the Phasio application.
  version: '1.0'
servers:
- url: https://m-api.eu.phas.io
  description: Generated server url
security:
- Phasio API Bearer Token: []
tags:
- name: equation-resource
paths:
  /api/manufacturer/v1/equation:
    post:
      tags:
      - equation-resource
      operationId: create_14
      parameters:
      - name: processId
        in: query
        description: ID of the process to create an equation for
        required: false
        schema:
          type: string
          format: uuid
      - name: postProcessId
        in: query
        description: ID of the post-process to create an equation for
        required: false
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquationRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TypescriptEquationDto'
      summary: Create 14
      x-summary-source: derived
  /api/manufacturer/v1/equation/{equationId}:
    delete:
      tags:
      - equation-resource
      operationId: delete_11
      parameters:
      - name: equationId
        in: path
        description: ID of the the equation to delete
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
      summary: Delete 11
      x-summary-source: derived
    patch:
      tags:
      - equation-resource
      operationId: updateEquation
      parameters:
      - name: equationId
        in: path
        description: ID of the the equation to update
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquationRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TypescriptEquationDto'
      summary: Update equation
      x-summary-source: derived
  /api/manufacturer/v1/equation/{equationId}/live:
    patch:
      tags:
      - equation-resource
      operationId: markAsLive
      parameters:
      - name: equationId
        in: path
        description: ID of the equation to make live on connected process or post-processing
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
      summary: Mark as live
      x-summary-source: derived
components:
  schemas:
    EquationRequest:
      type: object
      properties:
        name:
          type: string
        equation:
          type: string
      required:
      - equation
      - name
    TypescriptEquationDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        equation:
          type: string
        variables:
          type: array
          items:
            type: string
        lastUpdated:
          type: string
          format: date-time
      required:
      - equation
      - id
      - lastUpdated
      - variables
  securitySchemes:
    Phasio_API_Bearer_Token:
      type: http
      name: Authorization
      in: header
      scheme: bearer
      bearerFormat: JWT
